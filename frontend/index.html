<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Student Progress Manager</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 18px;background:#101522;color:#eef}input,button{font:inherit;padding:12px;margin:6px 0;width:100%;box-sizing:border-box;border-radius:9px}button{background:#7c9cff;border:0}pre{white-space:pre-wrap;background:#202a3b;padding:14px}</style><h1>Student Progress Manager</h1><input id="api" value="https://student-progress-api-m0g5.onrender.com"><input id="name" placeholder="Student name"><input id="course" placeholder="Course"><input id="attendance" type="number" min="0" max="100" placeholder="Attendance %"><button onclick="add()">Add student</button><button onclick="load()">Refresh students</button><pre id="out"></pre><script>async function load(){let r=await fetch(api.value+'/students');out.textContent=JSON.stringify(await r.json(),null,2)}async function add(){let r=await fetch(api.value+'/students',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,course:course.value,attendance_percent:Number(attendance.value)})});out.textContent=JSON.stringify(await r.json(),null,2)}</script></html>
